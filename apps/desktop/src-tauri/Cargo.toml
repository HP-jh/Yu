[package]
name = "yu-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "屿 · 桌面宿主（Tauri 2）"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "yu"
path = "src/main.rs"
