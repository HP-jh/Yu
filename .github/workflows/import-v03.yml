name: import-v03
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  import:
    if: contains(github.event.head_commit.message, '[import-v03]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch source
        run: |
          curl -L --fail -o /tmp/yu.tgz 'https://aka.doubaocdn.com/s/MUThr9uDUD'
          mkdir -p /tmp/yu
          tar -xzf /tmp/yu.tgz -C /tmp/yu
      - name: Sync and push
        run: |
          rsync -a --delete --exclude '.git' /tmp/yu/yu/ ./
          git config user.name 'HP-jh'
          git config user.email 'HP-jh@users.noreply.github.com'
          git add -A
          git commit -m 'feat(v0.3): 待办提醒、Obsidian 双向、14 职业包、Notion/Microsoft/MCP' || true
          git push origin HEAD:main
